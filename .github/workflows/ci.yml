name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches: 
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v7.0.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9 # v9.3.0

  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7 # v7.0.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v8 # pin verified pre-release
      - run: go mod tidy
      - run: go test -race -count=1 ./...

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v7.0.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o spm ./cmd/spm