name: security
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - run: uv export --format requirements-txt --output-file requirements.txt
      - run: uvx pip-audit -r requirements.txt
