# Managed by spm — standard rigor swaps `go vet` for golangci-lint
# (config lives in .golangci.yml at the repo root).
# Install once: lefthook install
pre-commit:
  commands:
    fmt-check:
      glob: "*.go"
      run: test -z "$(gofmt -l {staged_files})"
      skip:
        - merge
        - rebase
    lint:
      glob: "*.go"
      run: golangci-lint run
      skip:
        - merge
        - rebase

commit-msg:
  commands:
    capitalize:
      run: |
        MSG=$(cat "{1}")
        if ! echo "$MSG" | grep -qE "^[A-Z].*$"; then
          echo "Commit messages start with a capital letter (imperative mood)." >&2
          exit 1
        fi

pre-push:
  commands:
    test:
      run: go test -race ./...
